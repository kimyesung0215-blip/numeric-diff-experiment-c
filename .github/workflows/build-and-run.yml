name: Build and run numeric diff experiment

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Run experiment
        run: make run

      - name: Upload CSV results
        uses: actions/upload-artifact@v4
        with:
          name: numeric-diff-results
          path: |
            numeric_diff_data.csv
            numeric_diff_summary.csv
